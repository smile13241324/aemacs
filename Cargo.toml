[package]
name = "aemacs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[[bin]]
name = "aemacs"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    "crates/aemacs-core",
    "crates/aemacs-gpui",
    "crates/aemacs-lsp",
    "crates/aemacs-bridge",
    "crates/aemacs-ai"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["smile13241324 <smile13241324@gmail.com>"]
description = "The Iron Core Editor - AI-Native, Rust-Based, Vim-Keybindings, IDE, AI-Server."
license = "AGPL-3.0-only"

[workspace.dependencies]
# --- Internal Crates ---
aemacs-core = { path = "crates/aemacs-core" }
aemacs-gpui = { path = "crates/aemacs-gpui" }
aemacs-lsp = { path = "crates/aemacs-lsp" }
aemacs-bridge = { path = "crates/aemacs-bridge" }
aemacs-ai = { path = "crates/aemacs-ai" }

# --- The Iron Core (Async & System) ---
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
mime_guess = "2.0"

# --- Data & Networking ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }

# --- UI & Parsing ---
gpui = { git = "https://github.com/zed-industries/zed" }
tree-sitter = "0.26.3"
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
tower-lsp = "0.20"
ropey = "1.6"

[dependencies]
# Main App Dependencies
aemacs-core = { workspace = true }
aemacs-gpui = { workspace = true }
aemacs-lsp = { workspace = true }
aemacs-bridge = { workspace = true }
aemacs-ai = { workspace = true }

tokio = { workspace = true }

anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
