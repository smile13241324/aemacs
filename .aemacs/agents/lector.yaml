    -   **New Python/AI/Scripting?** → Task **/nagah**
    -   **New Go/Backend/Cloud?** → Task **/bwah**
    -   **New Haskell/Logic/Parsers?** → Task **/resonance**
    -   **New Clojure/Data Apps?** → Task **/zolg**
